name: Batchalign Python

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Parallel-with-build-cli `cargo check` of the imported Rust crates.
  # Previously lived inside `rust-integration` (post-build-wheel); moved
  # here so the ~5 min of check work doesn't sit on the critical path
  # behind Build CLI + Build Wheel. Shares the rust-workspace cache key
  # with build-cli so workspace dep compile is reused.
  batchalign-check:
    name: Rust Imported Crate Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-workspace
      # The batchalign crate embeds the dashboard via
      # `include_dir!("$CARGO_MANIFEST_DIR/../../frontend/dist")`
      # in `crates/batchalign/src/routes/dashboard.rs`. The macro
      # expands at compile time and panics if the directory does
      # not exist, so we build the dashboard before cargo check.
      - name: Build dashboard
        run: make batchalign-dashboard-build
      - name: Rust imported crate check
        run: make batchalign-check

  build-cli:
    name: Build CLI Binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-workspace
      - name: Build dashboard
        run: make batchalign-dashboard-build
      - name: Build CLI binary
        run: cargo build --release -p batchalign
      - uses: actions/upload-artifact@v7
        with:
          name: cli-binary
          path: target/release/batchalign3
          retention-days: 1
      - uses: actions/upload-artifact@v7
        with:
          name: dashboard-dist
          path: frontend/dist/
          retention-days: 1
          if-no-files-found: error

  build-wheel:
    name: Build Wheel (${{ matrix.python-version }})
    needs: build-cli
    runs-on: ubuntu-latest
    strategy:
      # Build a wheel for every officially supported Python on every push and
      # dispatch: 3.13 (deployment target) plus 3.14. All supported
      # versions are continuously gated; talkbank-tools is public, so the extra
      # matrix legs cost no Actions minutes. fail-fast off so one version's
      # failure still reports the others.
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "pyo3 -> target"
          shared-key: build-wheel-${{ matrix.python-version }}
      - uses: actions/download-artifact@v8
        with:
          name: cli-binary
          path: batchalign/_bin/
      - uses: actions/download-artifact@v8
        with:
          name: dashboard-dist
          path: frontend/dist/
      - name: Make CLI binary executable
        run: chmod +x batchalign/_bin/batchalign3
      - name: Build wheel
        # BATCHALIGN_PRESTAGED_BIN=1 tells the Makefile to reuse the
        # binary downloaded above (from build-cli, compiled from THIS
        # commit's sources). Skips ~9 min of duplicate fat-LTO compile
        # per matrix entry. The 2026-04-29 deploy postmortem's stale-
        # binary risk does not apply here because the artifact came
        # from build-cli's compile of the same commit.
        env:
          BATCHALIGN_PRESTAGED_BIN: "1"
        run: make batchalign-build-wheel
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.python-version }}
          path: dist/*.whl
          retention-days: 1

  test:
    name: Test (${{ matrix.python-version }})
    needs: build-wheel
    runs-on: ubuntu-latest
    strategy:
      # Test every officially supported Python (3.13/3.14) on every push
      # and dispatch; see build-wheel for the rationale. fail-fast off so one
      # version's failure still reports the others.
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v8
        with:
          name: wheel-${{ matrix.python-version }}
          path: dist/
      - name: Install from pre-built wheel
        run: |
          uv sync --group dev --no-install-project
          uv pip install --no-deps dist/*.whl
      - name: Run tests
        run: uv run --no-sync pytest batchalign --disable-pytest-warnings -k 'not test_whisper_fa_pipeline'

  smoke-test:
    name: Wheel Smoke Test
    needs: build-wheel
    runs-on: ubuntu-latest
    steps:
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          python-version: "3.13"
      - uses: actions/download-artifact@v8
        with:
          name: wheel-3.13
          path: dist/
      - name: Install wheel in clean environment
        run: uv tool install --from dist/*.whl batchalign3
      - name: "Smoke test: batchalign3 --help"
        run: batchalign3 --help
      - name: "Smoke test: batchalign3 version"
        run: batchalign3 version

  typecheck:
    name: Type Check & CI Hygiene
    needs: build-wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-workspace
      - uses: actions/download-artifact@v8
        with:
          name: wheel-3.13
          path: dist/
      - uses: actions/download-artifact@v8
        with:
          name: dashboard-dist
          path: frontend/dist/
      - name: Install from pre-built wheel
        run: |
          uv sync --group dev --no-install-project
          uv pip install --no-deps dist/*.whl
      - name: Verify retirement gates
        run: |
          test ! -e batchalign/cli/cli.py
          test ! -e batchalign/serve/app.py
          test ! -e batchalign/serve/job_store.py
      - name: CI hygiene (Rust)
        # Call the xtask subcommand directly. The previous form was
        # `cargo test -p batchalign --test ci_checks -q`, which compiled
        # the entire batchalign crate in dev/test mode (~8 minutes) just
        # to invoke a 21-line wrapper test that called this exact xtask.
        # The wrapper added no value; the xtask is the canonical
        # implementation.
        run: cargo run -q -p xtask -- lint-ci-hygiene
      - name: Verify runtime constants
        run: uv run --no-sync python scripts/check_runtime_drift.py
      - name: Verify IPC schema matches the Rust types
        # The schema is generated from the Rust types and committed. Nothing
        # ran this before, so a schema stale against its own source could sit
        # in the tree indefinitely; the conformance test reads the SCHEMA, so a
        # stale one silently checks Python against yesterday's contract.
        #
        # Through `uv run`, so the check uses the release binary bundled in the
        # wheel this job already installed. A bare `cargo run` would compile
        # the crate again in the debug profile, which is the cost the CI
        # hygiene step above was rewritten to avoid.
        run: uv run --no-sync batchalign3 ipc-schema --check --output ipc-schema/
      - name: Ruff lint
        # Config lives in pyproject.toml, and ruff comes from the dev group in
        # uv.lock, so this run and a developer's `make batchalign-lint-python`
        # resolve the same version and the same rules.
        run: uv run --no-sync ruff check .
      - name: Ruff format check
        run: uv run --no-sync ruff format --check .
      - name: Strict mypy
        run: uv run --no-sync mypy

  generated-artifacts:
    name: Generated Artifacts
    runs-on: ubuntu-latest
    # API-drift verification runs `make batchalign-dashboard-api-check`,
    # which transitively invokes cargo to regenerate openapi.json from
    # the Rust server, then diffs the result. Needs the pinned
    # toolchain + protoc; rust-cache is intentionally omitted to keep
    # the gate's startup cheap.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci
      - name: Verify dashboard API artifacts
        run: make batchalign-dashboard-api-check

  # Note: the previous standalone `dashboard-web-build` job was retired
  # its API-drift step duplicated `generated-artifacts` above, and its
  # dashboard build duplicated the one in `build-cli` (which now uploads
  # the result as the `dashboard-dist` artifact for downstream jobs).

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
      - name: Python audit
        # Allowlisted advisories, each with rationale. Batchalign loads only
        # trusted first-party models (Whisper / Stanza from known sources)
        # and hardcoded nltk resource names; no attacker-controlled model or
        # resource paths reach the vulnerable APIs.
        #
        # - PYSEC-2025-217, CVE-2026-1839 (transformers 4.x): no stable fix
        #   existed when allowlisted (only 5.0.0rc3, breaking-major).
        # - CVE-2026-4372 (transformers, RCE via untrusted model loading;
        #   fixed in 5.3.0): the fix is an untested 4.x -> 5.x major bump.
        #   This codebase is in its handover window (successor batchalign
        #   replaces it fleet-wide; decided 2026-07-07), so revalidating the
        #   whole ML pipeline against transformers 5 buys nothing. EXPIRY:
        #   if the handover has not completed by 2026-09-01, do the bump
        #   properly instead of extending this ignore.
        # - PYSEC-2026-597 (nltk percent-encoded path traversal in
        #   nltk.data.load()): NO fixed release exists; resource names here
        #   are hardcoded, never user input. Re-check for a fix opportunistically.
        # - PYSEC-2026-2290 / CVE-2026-5241 (transformers, LightGlue
        #   config.json overrides trust_remote_code=False): NO fixed release
        #   exists (advisory says all <= 5.2.0 affected). Batchalign never
        #   loads LightGlue models and loads only its pinned first-party
        #   model set, so the vulnerable path is unreachable. Re-check for a
        #   fixed release opportunistically.
        run: |
          uv export --no-hashes --no-dev --no-emit-project > requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt \
            --ignore-vuln PYSEC-2025-217 \
            --ignore-vuln CVE-2026-1839 \
            --ignore-vuln CVE-2026-4372 \
            --ignore-vuln PYSEC-2026-597 \
            --ignore-vuln PYSEC-2026-2290
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-workspace
      - name: Generate lockfile
        run: cargo generate-lockfile
      - name: RustSec audit
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: taiki-e/install-action@cargo-deny
      - name: cargo-deny
        run: cargo deny check

  rust-integration:
    name: Rust Integration
    # Depends on both build-cli (for the prebuilt batchalign3 binary
    # used in the smoke test) and build-wheel (for the Python wheel
    # used by the test-echo runtime). Reusing build-cli's binary saves
    # ~5 min of duplicate debug-mode compilation.
    needs: [build-cli, build-wheel]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-workspace
      - uses: actions/download-artifact@v8
        with:
          name: dashboard-dist
          path: frontend/dist/
      - uses: actions/download-artifact@v8
        with:
          name: wheel-3.13
          path: dist/
      - uses: actions/download-artifact@v8
        with:
          name: cli-binary
          path: target/release/
      - name: Make CLI binary executable
        run: chmod +x target/release/batchalign3
      - name: Install batchalign
        run: |
          uv sync --group dev --no-install-project
          uv pip install --no-deps dist/*.whl
      # The "Rust imported crate check" step (make batchalign-check)
      # moved to its own parallel job `batchalign-check`. It doesn't
      # need build-cli's binary or build-wheel's wheel, so running it
      # post-build-wheel was pure critical-path overhead.
      - name: Server startup smoke test
        # Uses build-cli's release binary instead of doing a debug
        # rebuild in-job. The smoke test exercises the server's
        # startup path with --test-echo; release vs debug binary makes
        # no behavioral difference to that path.
        #
        # `--warmup off` was dropped when startup warmup was retired: the
        # flag no longer exists and the server refuses to start with it.
        env:
          BATCHALIGN_PYTHON: ${{ github.workspace }}/.venv/bin/python
        run: |
          ./target/release/batchalign3 serve start \
            --foreground --test-echo --port 18123 &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:18123/health | grep -q '"status":"ok"'; then
              echo "Server healthy after ${i}s"
              kill $SERVER_PID
              wait $SERVER_PID 2>/dev/null || true
              exit 0
            fi
            sleep 1
          done
          echo "Server failed to start within 30s"
          kill $SERVER_PID 2>/dev/null || true
          exit 1

  coverage:
    name: Coverage
    needs: build-wheel
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v7
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo rm -rf /usr/local/lib/android /usr/share/swift
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rust-workspace
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: actions/download-artifact@v8
        with:
          name: wheel-3.13
          path: dist/
      - name: Install from pre-built wheel
        run: |
          uv sync --group dev --no-install-project
          uv pip install --no-deps dist/*.whl
      - name: Python coverage
        run: uv run --no-sync pytest --cov=batchalign --cov-report=lcov:lcov-python.info batchalign --disable-pytest-warnings -k 'not test_whisper_fa_pipeline'
      # `cargo llvm-cov` with no runner argument drives `cargo test`. It used to
      # say `llvm-cov nextest`, which cannot work: nextest is banned and
      # uninstalled in this workspace. The PyO3 step also pointed at
      # `pyo3/Cargo.toml`, a path that has not existed since the crate moved
      # under `crates/`, so `-p` is used instead of a path that can go stale.
      # Both defects were invisible because this job is `workflow_dispatch`-only.
      - name: Rust PyO3 coverage
        run: cargo llvm-cov -p batchalign-pyo3 --lcov --output-path lcov-rust.info
      - name: Rust workspace coverage
        run: cargo llvm-cov --workspace --lcov --output-path lcov-rust-workspace.info

  dashboard-smoke:
    name: Dashboard Smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            frontend/e2e/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: dashboard-release
      - name: Run smoke suite
        env:
          BATCHALIGN_PLAYWRIGHT_WITH_DEPS: "1"
          RUSTFLAGS: -C debuginfo=0
        run: bash scripts/run_react_dashboard_smoke.sh

  dashboard-e2e:
    name: Dashboard E2E
    # Depends on both build-cli (for the pre-built batchalign3 binary)
    # and build-wheel (for the Python wheel). Reusing build-cli's
    # binary instead of rebuilding here saves ~25 minutes of fat-LTO
    # Rust release compilation on every push, the bulk of the
    # historical Dashboard E2E wall-time.
    needs: [build-cli, build-wheel]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo rm -rf /usr/local/lib/android /usr/share/swift
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: true
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: dashboard-release
      - uses: actions/download-artifact@v8
        with:
          name: wheel-3.13
          path: dist/
      - uses: actions/download-artifact@v8
        with:
          name: cli-binary
          path: target/release/
      - name: Make CLI binary executable
        run: chmod +x target/release/batchalign3
      - name: Install from pre-built wheel
        run: |
          uv sync --group dev --no-install-project
          uv pip install --no-deps dist/*.whl
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            frontend/e2e/package-lock.json
      - name: Run E2E suite
        env:
          BATCHALIGN_PLAYWRIGHT_WITH_DEPS: "1"
          BATCHALIGN_REAL_SERVER_E2E: "1"
          # scripts/run_react_dashboard_smoke.sh checks BATCHALIGN_BIN
          # and skips the cargo release build if the binary is already
          # in place. Pointing at the artifact downloaded above is what
          # makes this job sub-15-minute.
          BATCHALIGN_BIN: ${{ github.workspace }}/target/release/batchalign3
          RUSTFLAGS: -C debuginfo=0
        run: |
          BATCHALIGN_PYTHON="$(uv run --no-sync python -c 'import sys; print(sys.executable)')"
          export BATCHALIGN_PYTHON
          bash scripts/run_react_dashboard_smoke.sh
