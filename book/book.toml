[book]
title = "TalkBank Toolchain"
authors = ["TalkBank Contributors"]
description = "Unified user, developer, and architecture documentation for the TalkBank toolchain: chatter, Batchalign3, the VS Code extension, and the CLAN command reimplementation."
language = "en"
src = "src"

[build]
build-dir = "build"
create-missing = false

[preprocessor.mermaid]
command = "mdbook-mermaid"

# Git-derived "last changed" dates: `{{git-dates:page}}` and `{{git-dates:book}}`
# are substituted wherever a page uses them, and every page gets a footer with
# both. mdBook runs preprocessors with the book directory as cwd, hence `..`.
# Needs full git history (refuses a shallow clone). `make book-check` verifies
# the rendered front page carries the same dates git reports.
[preprocessor.git-dates]
command = "python3 ../scripts/mdbook_git_dates.py"

[output.html]
git-repository-url = "https://github.com/TalkBank/talkbank-tools"
edit-url-template = "https://github.com/TalkBank/talkbank-tools/edit/main/book/{path}"
