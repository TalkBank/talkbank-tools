[package]
name = "batchalign-whisper-pilot"
version = "0.1.0"
description = "Pilot crate measuring Rust-native Whisper inference (candle + whisper-rs) against the Python sidecar baseline. Not part of the production batchalign3 build."
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
name = "batchalign_whisper_pilot"
path = "src/lib.rs"

[[bin]]
name = "candle-pilot"
path = "src/bin/candle_pilot.rs"

[[bin]]
name = "whisper-rs-pilot"
path = "src/bin/whisper_rs_pilot.rs"

[dependencies]
# Whisper inference (candle).
candle-core = { workspace = true }
candle-nn = { workspace = true }
candle-transformers = { workspace = true }

# Whisper inference (whisper.cpp via Rust bindings), the third pilot arm.
whisper-rs = { workspace = true }

# Audio decoding + resampling.
symphonia = { workspace = true }
rubato = { workspace = true }
audioadapter-buffers = { workspace = true }

# Model + tokenizer plumbing.
hf-hub = { workspace = true }
tokenizers = { workspace = true }

# Numeric utilities.
byteorder = { workspace = true }
rand = { workspace = true }

# Common.
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive"] }
log = { workspace = true }
env_logger = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
