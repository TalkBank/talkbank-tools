[package]
name = "batchalign"
version = "0.1.0"
description = "batchalign3: command-line interface, application, server, worker pool, cache"
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
# whisper-rs-backend is DEFAULT (Franklin, 2026-07-28): the engine must
# never silently vanish from a build again (the non-default gate cost us
# the local install when later rebuilds forgot the flag). The price is
# that every build needs the C/C++ toolchain for whisper.cpp; that is
# accepted.
default = ["server", "binary-entry", "embed-dashboard", "whisper-rs-backend"]

# Gate for the heavy ML golden suite (real Rev.AI keys, network, multi-GB
# models). Declared as a feature so the `ml_golden` test target below is
# skipped by a plain `cargo test`, replacing the exclusion that used to live
# ONLY in `.config/nextest.toml` as `default-filter = 'not binary(ml_golden)'`.
# That made correctness depend on which runner you used: with nextest removed
# on 2026-07-27, `cargo test` would have started pulling models and calling
# Rev.AI. The exclusion now lives in the code, where it belongs.
#
# Run the suite explicitly with:
#   cargo test -p batchalign --features ml-golden --test ml_golden
ml-golden = []

# Binary entrypoint: tracing-OTLP exporter and pre-main initialization
# for the `batchalign3` CLI binary. The library does not require this.
binary-entry = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
]

# HTTP server, SQLite job persistence, OpenAPI schema.
# Disable this feature for direct-mode-only builds that do not need axum
# or the route/DB layer.
server = [
    "dep:axum",
    "dep:tower-http",
    "dep:utoipa",
]

# Embed the React dashboard (frontend/dist/) into the binary at compile time.
# Requires `make build-dashboard` first. Without this feature, the dashboard is
# served from $BATCHALIGN_DASHBOARD_DIR or ~/.batchalign3/dashboard/ only.
embed-dashboard = ["dep:include_dir"]

# Dev-time async runtime debugger (tokio-console). Production binaries
# MUST NOT enable this feature, it requires `--cfg tokio_unstable` at
# build time (couples to non-stable Tokio APIs) and pulls in the
# tonic/prost gRPC server dep tree. Build with:
#   RUSTFLAGS="--cfg tokio_unstable" cargo build --features debug-runtime
# Then attach with `tokio-console http://127.0.0.1:6669`.
debug-runtime = ["dep:console-subscriber"]

# Rust-native Whisper ASR (whisper.cpp via whisper-rs), replacing the Python
# worker for the `whisper_rs` engine. DEFAULT since 2026-07-28: every build
# carries the native path (see the note on `default` above). Audio
# decode/resample (symphonia + rubato) rides the same feature.
whisper-rs-backend = [
    "dep:whisper-rs",
    "dep:symphonia",
    "dep:rubato",
    "dep:audioadapter-buffers",
    "dep:hf-hub",
]
# CoreML acceleration on Apple Silicon (requires a sibling <model>-encoder.mlmodelc
# bundle at runtime). CUDA acceleration on Linux/Windows (requires the CUDA
# toolkit at build time). Both are additive on top of whisper-rs-backend.
whisper-rs-coreml = ["whisper-rs?/coreml"]
whisper-rs-cuda = ["whisper-rs?/cuda"]

[[bin]]
# The artifact name `batchalign3` is load-bearing: fleet deploys
# (`deploy/scripts/deploy_batchalign3.sh`) pick up
# `target/release/batchalign3`. Do NOT rename.
name = "batchalign3"
path = "src/bin/batchalign3.rs"
required-features = ["binary-entry"]

[dependencies]
# ── Always required (engine + direct mode) ────────────────────────────
batchalign-types = { workspace = true }
# chat_ops module deps (formerly batchalign-chat-ops, folded 2026-04-30)
talkbank-model = { workspace = true }
talkbank-parser = { workspace = true }
batchalign-transform = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
libc = { workspace = true }
sqlx = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
dashmap = { workspace = true }
dirs = { workspace = true }
walkdir = { workspace = true }
sysinfo = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
schemars = { workspace = true }
toml = { workspace = true }
tokio-util = { workspace = true }
tokio-stream = { workspace = true }
chrono = { workspace = true }
async-trait = { workspace = true }
blake3 = { workspace = true }
moka = { workspace = true }
fs2 = { workspace = true }
tempfile = "3"

# ── CLI surface (formerly batchalign-cli) ────────────────────────────
clap = { workspace = true }
csv = { workspace = true }
indicatif = { workspace = true }
rand = { workspace = true }
zip = { workspace = true }
ratatui = { workspace = true }
crossterm = { workspace = true }

# ── Staged remote execution (rsync orchestrator polls via HTTP) ──────
reqwest = { workspace = true }

# ── Binary entry (optional, behind "binary-entry") ───────────────────
tracing-opentelemetry = { workspace = true, optional = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }

# ── Dev-time async runtime debugger (optional, behind "debug-runtime") ─
console-subscriber = { version = "0.5", optional = true }

# ── Server-only (optional, behind "server" feature) ──────────────────
axum = { workspace = true, optional = true }
tower-http = { workspace = true, optional = true }
utoipa = { workspace = true, optional = true }

# ── Embed dashboard (optional) ───────────────────────────────────────
include_dir = { workspace = true, optional = true }

# ── Rust-native Whisper ASR (optional, behind "whisper-rs-backend") ───
# whisper-rs itself is declared per-platform below (macOS enables Metal).
symphonia = { workspace = true, optional = true }
rubato = { workspace = true, optional = true }
audioadapter-buffers = { workspace = true, optional = true }
# Default-model auto-fetch (ggml-large-v3 from ggerganov/whisper.cpp).
hf-hub = { workspace = true, optional = true }

# whisper-rs compiles whisper.cpp (C/C++). On macOS the Metal backend is always
# built; CoreML/CUDA are additive opt-ins via the whisper-rs-coreml/-cuda
# features. Kept optional so non-native builds skip the C toolchain entirely.
[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { workspace = true, features = ["metal"], optional = true }

[target.'cfg(not(target_os = "macos"))'.dependencies]
whisper-rs = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
reqwest = { workspace = true }
insta = { workspace = true }
tempfile = { workspace = true }
batchalign-types = { workspace = true }
axum = { workspace = true }
assert_cmd = { workspace = true }
predicates = { workspace = true }
toml = { workspace = true }
rstest = { workspace = true }
# Integration tests installed NO tracing subscriber before 2026-07-28, so every
# `tracing::warn!` the in-process server emitted was invisible. A swallowed
# error was therefore doubly hidden: not propagated, and not logged anywhere a
# test could see. Tests that care install a WARN-level test-writer subscriber.
tracing-subscriber = { workspace = true }
proptest = { workspace = true }
# Enables `ChatCleanedText::test_unchecked` for test fixture
# construction. Production builds cannot reach the escape hatch.
talkbank-model = { workspace = true, features = ["test-utils"] }

# Deterministic simulation testing (network faults, virtual time)
turmoil = "0.7"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["client-legacy", "tokio"] }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

# This crate finished its panic-site audit on 2026-04-29 (see
# `docs/panic-audit/batchalign-app.md`, `docs/panic-audit/batchalign-cli.md`,
# and `docs/panic-audit/batchalign-chat-ops.md`).
# All non-test panic shapes carry rationale-bearing `#[allow]` annotations;
# the workspace `warn` floor is promoted to `deny` here so new sites need a
# deliberate opt-in. See `talkbank-lsp/Cargo.toml` for the same pattern + the
# rationale on why workspace-inheritance is replaced with an inlined table.
[lints.clippy]
unwrap_used   = "deny"
expect_used   = "deny"
panic         = "deny"
unreachable   = "deny"
todo          = "deny"
unimplemented = "deny"

# Auto-discovered from tests/ml_golden.rs; declared explicitly only to attach
# the required-features gate above. Without this block cargo would build and
# run it on every `cargo test`.
[[test]]
name = "ml_golden"
required-features = ["ml-golden"]
