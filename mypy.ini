[mypy]
python_version = 3.12
files = batchalign
exclude = batchalign/tests
ignore_missing_imports = true
mypy_path = stubs
strict = true
show_error_codes = true

# ML inference and model-training code interacts with PyTorch, HuggingFace
# Transformers, NeMo, etc. whose type stubs are incomplete or incorrect.
# Strict checking is not useful here, relax to avoid chasing upstream stubs.
[mypy-batchalign.inference.*]
ignore_errors = true

# ...but the carve-out above is about ML STUBS, and modules with no ML surface
# should not inherit it. `_italian_mwt` imports only `collections.abc`,
# `dataclasses` and `enum`, and it is pure decision logic over closed classes,
# which is exactly the code strict checking is for. Re-enabled 2026-07-31 after
# a function with two hard errors (an undefined name, and a bool returned from
# a `-> None` signature) landed and nothing noticed: the blanket ignore was the
# only reason it could. Add modules here as they are shown to be stub-free.
[mypy-batchalign.inference._italian_mwt]
ignore_errors = false

[mypy-batchalign.models.*]
ignore_errors = true

[mypy-batchalign.worker._main]
ignore_errors = true

# Generated Pydantic models from datamodel-codegen. StrEnum members named
# "translate" clash with str.translate(), a codegen artifact, not a real bug.
[mypy-batchalign.generated.*]
ignore_errors = true
